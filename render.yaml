services:
    - type: web
    name: myanmyanpay-backend
    env: node
    plan: free
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    envVars:
            - key: APP_ID
        sync: false
            - key: PUBLISHABLE_KEY
        sync: false
            - key: SECRET_KEY
        sync: false
            - key: API_BASE_URL
        value: https://ezapi.myanmyanpay.com
